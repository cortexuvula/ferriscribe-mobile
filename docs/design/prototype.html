<div class="review"><div class="review-top"><div><div class="eyebrow">FerriScribe Mobile / design proposal</div><h1>A calmer place to finish the consultation.</h1><p>Clickable design simulation · synthetic patient text only · no server, microphone, camera, clipboard or sharing access.</p></div><div class="eyebrow">Clinical workspace / v1</div></div>
<div class="toolbar"><button class="review-button" id="view-toggle">Overview</button><label>Screen <select id="screen-picker" aria-label="Preview screen"></select></label><label>Theme <select id="theme-picker" aria-label="Preview theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label><label>State <select id="state-picker" aria-label="Preview state"><option value="normal">Normal</option><option value="offline">Offline / cache</option><option value="empty">Empty list</option><option value="error">Load / upload error</option><option value="saveerror">Save failure</option><option value="loading">Loading</option><option value="long">30-minute warning</option></select></label><button class="review-button" id="text-size">Larger text</button></div><main id="preview"></main></div>

const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[n]||paths.file}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=new URLSearchParams(location.search);
let theme=q.get('theme')||localStorage.getItem('fs-design-theme')||'system',screen=q.get('screen')||'home',state=q.get('state')||'normal',board=q.get('board')==='1',large=false,modal=null,dirty=false,contextAdded=false,search='',selectedFormat='pdf',currentDoc='SOAP note';

const baseDoc='S — SUBJECTIVE\nDEMO PATIENT A describes a mild cough for three days. This is synthetic text for layout review.\n\nO — OBJECTIVE\nNo examination findings supplied in this demonstration.\n\nA — ASSESSMENT\nIllustrative assessment text only. Not a clinical record.\n\nP — PLAN\nDemonstration plan text for reviewing paragraph spacing, line breaks and edit controls.';
let editText=baseDoc,contextName='DEMO PATIENT A';
const isDark=()=>theme==='dark'||theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches;
function btn(label,act,style='',ico=''){return `<button class="btn ${style}" data-action="${act}" ${act==='noop'?'disabled aria-disabled="true"':''}>${ico?icon(ico):''}${label}</button>`}
function textbtn(label,act,style=''){return `<button class="textbutton ${style}" data-action="${act}">${label}</button>`}
function head(title,back='home',right=''){return `<header class="appbar">${back?`<button class="iconbutton" data-action="go:${back}" aria-label="Back">${icon('back')}</button>`:''}<div class="title ${back?'':'brand'}">${title}</div>${right}</header>`}
function footer(content){return `<footer class="footer">${content}</footer>`}
function notice(text,type='',action=''){return `<div class="notice ${type}">${icon(type==='error'?'alert':type==='warn'?'offline':type==='success'?'check':'shield')}<div>${text}${action}</div></div>`}
function row(label,sub,act,ico='file'){return `<button class="settings-row" data-action="${act}">${icon(ico)}<span class="words"><strong>${label}</strong><small>${sub}</small></span>${icon('chevron')}</button>`}
function option(label,sub,val,selected,action){return `<button class="settings-row" role="radio" aria-checked="${val===selected}" data-action="${action}:${val}"><span class="words"><strong>${label}</strong>${sub?`<small>${sub}</small>`:''}</span><span class="radio ${val===selected?'checked':''}"></span></button>`}
function layout(h,b,f=''){return h+`<section class="scroll">${b}</section>`+f}
function home(){let list='';if(state==='loading'){list='<div role="status" class="small muted">Loading consultations…</div><div class="skeleton"></div><div class="skeleton"></div>'}else if(state==='error'){list='<div class="empty-state">'+icon('offline')+'<h3>Could not reach your office</h3><p class="muted">Check that FerriScribe and Tailscale are running.</p>'+btn('Try again','retry','secondary')+'</div>'}else if(state==='empty'){list='<div class="empty-state">'+icon('file')+'<h3>No consultations yet</h3><p class="muted">Record a consultation to get started.</p></div>'}else{const records=[['DEMO PATIENT A','Mon 7 Sep · 09:40 · 08:12','SOAP available'],['Consultation · Mon 7 Sep','09:10 · 05:42','Documents available'],['DEMO PATIENT B','Sun 6 Sep · 16:25 · 12:06','SOAP available']];list=records.filter(r=>r[0].toLowerCase().includes(search.toLowerCase())).map((r,i)=>`<button class="consult-row" data-action="go:detail"><span class="words"><strong>${r[0]}</strong><p>${r[1]}</p><span class="chip ${i===1?'':'ready'}">${icon(state==='offline'?'offline':'check')}${state==='offline'?'Cached documents':r[2]}</span></span>${icon('chevron')}</button>`).join('')||'<div class="empty-state"><h3>No matches</h3>'+textbtn('Clear search','clearsearch')+'</div>'}
return layout(head('Ferri<span class="accent">Scribe</span>',null,`<button class="iconbutton" data-action="go:settings" aria-label="Settings">${icon('settings')}</button>`),`<div class="connection">${icon(state==='offline'?'offline':'link')}<span>Office server · ${state==='offline'?'unreachable':'not checked'}</span>${textbtn('Check','check')}</div><h2>Consultations</h2><label class="searchbox">${icon('search')}<input aria-label="Search consultations" placeholder="Search name or consultation" value="${esc(search)}" data-input="search"></label>${state==='offline'?notice('Offline · showing cached consultations','warn',textbtn('Retry connection','retry')):''}<div class="section-label">Recently updated</div><div id="results">${list}</div>`,footer(btn('New consultation','go:prepare','','plus')))}
function prepare(){return layout(head('New consultation'),'<h2>Ready when you are.</h2><p class="muted">Record the conversation, then generate a SOAP note.</p><h3>Before you start</h3><div class="group">'+row('Patient context',contextAdded?'Added for this consultation':'Optional · name, medications, history','go:context','file')+'</div>'+notice('Keep FerriScribe open while recording. Audio is not saved as a recording file on this phone.')+(state==='offline'?notice('Office server unreachable. Reconnect before starting.','warn',textbtn('Check again','retry')):''),footer(btn('Start recording',state==='offline'?'noop':'start','','mic')+textbtn('Back to consultations','go:home')))}
function contextForm(){return layout(head('Patient context','prepare'),'<p class="muted">Optional information for this consultation. Blank fields mean not provided.</p><label class="form-label" for="patient-name">Patient name (optional)</label><input id="patient-name" class="field" value="'+(contextAdded?esc(contextName):'')+'" placeholder="Enter patient name" autocomplete="off"><label class="form-label" for="meds">Medications</label><textarea id="meds" class="field" placeholder="One per line"></textarea><label class="form-label" for="conditions">Conditions</label><textarea id="conditions" class="field" placeholder="One per line"></textarea><label class="form-label" for="allergies">Allergies</label><textarea id="allergies" class="field" placeholder="One per line"></textarea><p class="helper">Leave blank if not provided. This does not mean no known allergies.</p><label class="form-label" for="prior">Prior SOAP notes / history</label><textarea id="prior" class="field" placeholder="Optional prior context"></textarea>',footer(btn('Use context','usecontext')))}
function record(){return head('Recording','discard')+`<section class="scroll focus"><div class="context-banner"><strong>${contextAdded?esc(contextName||'Patient context added'):'New consultation'}</strong><p>Audio held in memory on this phone</p></div><div class="rec-center"><div class="mic-disc">${icon('mic')}</div><div class="rec-label"><span class="dot"></span>Recording</div><div class="timer">${state==='long'?'30:00':'08:12'}</div><p class="muted small">Keep FerriScribe open.</p></div>${state==='long'?notice('30 minutes recorded. Recording stops automatically at 60 minutes.','warn'):''}<p class="small muted zero">When you stop, your audio is sent to the paired office server to generate the SOAP note.</p></section>`+footer(btn('Stop & generate SOAP','stop','','stop')+textbtn('Discard recording','discard','danger-text'))}
function processing(){if(state==='error')return layout(head('Processing','home'),notice('Could not upload audio','error')+'<h2>Your SOAP note isn’t ready.</h2><p class="muted">This example has no recoverable audio. Check the office connection before starting a new consultation.</p><p class="small muted">Design state: upload failure. A real retry is offered only when the app can safely recover the audio.</p>',footer(btn('Back to consultations','go:home')+textbtn('Connection settings','go:settings')));return layout(head('Preparing SOAP',null),'<h2>Working on your note.</h2><p class="muted">Your paired office server is processing the consultation.</p><ol class="steps">'+['Prepare consultation','Upload audio','Wait for office server','Transcribe conversation','Generate SOAP note'].map((s,i)=>`<li class="step ${i<3?'done':i===3?'active':''}"><span>${i<3?icon('check'):i+1}</span>${s}${i===3?'<span class="sr">In progress</span>':''}</li>`).join('')+'</ol><p class="small muted">No estimated completion time. This view follows the server’s reported stages.</p>',footer('<small>Design simulation — not a running job</small>'+btn('Simulate SOAP ready','go:complete','secondary')))}
function complete(){return layout(head('Consultation complete','home'),'<div class="result-icon">'+icon('check')+'</div><h2>SOAP note ready.</h2><p class="muted">Review the note before sharing or using it clinically.</p><div class="context-banner"><strong>DEMO PATIENT A</strong><p>Mon 7 Sep · 09:40 · 08:12 recorded</p></div>',footer(btn('Open SOAP note','open:SOAP note','','file')+textbtn('View consultation','go:detail')))}
function detail(){const docs=['SOAP note','Referral','Letter','Synopsis','Peer discussion'];return layout(head('Consultation','home'),'<h2>DEMO PATIENT A</h2><p class="small muted">Mon 7 Sep · 09:40 · 08:12 recorded</p>'+(state==='offline'?notice('Offline · only cached documents can be opened','warn'):'')+'<h3>Documents</h3><div class="group">'+docs.map((d,i)=>`<div class="doc-row"><span class="doc-number">${String(i+1).padStart(2,'0')}</span><span class="words"><strong>${d}</strong><small>${i===0||i===3?(state==='offline'?'Cached copy':'Available'):(state==='offline'?'Not cached':'Not generated')}</small></span>${i===0||i===3?textbtn('Open','open:'+d):state==='offline'?icon('offline'):textbtn('Generate',i===4?'go:peer':'generate:'+d)}</div>`).join('')+'</div><p class="small muted" style="margin-top:20px">Available means generated, not clinically reviewed.</p>')}
function docString(){return currentDoc==='SOAP note'?editText:currentDoc.toUpperCase()+'\n\nSynthetic demonstration document for DEMO PATIENT A.\n\nThis text illustrates the reading surface. It is not a clinical record.\n\nReview generated content before clinical use.'}
function reader(){return layout(head(currentDoc,'detail',`<button class="iconbutton" data-action="more" aria-label="Document actions">${icon('more')}</button>`),'<div class="context-banner" style="margin-top:0;padding-bottom:12px"><strong>DEMO PATIENT A</strong><p>Mon 7 Sep · 09:40</p></div><div class="doc-state">'+icon(state==='offline'?'offline':'check')+(state==='offline'?'Cached copy · offline':'From office server')+'</div>'+(state==='offline'?notice('Reconnect to edit or export this cached copy.','warn'):'')+'<div class="document">'+esc(docString())+'</div>',footer('<small>Review generated content before clinical use.</small><div class="actions">'+(state==='offline'?btn('Copy text','copy','secondary','copy'):btn('Export & share','export','secondary','share')+btn('Edit','go:edit','','edit'))+'</div>'))}
function edit(){return head('Edit '+currentDoc,'leaveedit')+`<section class="scroll focus"><div class="context-banner" style="margin-top:0;padding-bottom:12px"><strong>DEMO PATIENT A</strong><p id="edit-status">${dirty?'Unsaved changes':'Editing server copy'}</p></div>${state==='saveerror'?notice('Not saved. Your edits are still here. Reconnect and retry saving.','error'):''}<label class="sr" for="doc-edit">Document text</label><textarea id="doc-edit" class="editor" spellcheck="false">${esc(editText)}</textarea></section>`+footer(btn(state==='saveerror'?'Retry save':'Save changes','save')+textbtn('Keep reading','leaveedit'))}
function peer(){return layout(head('Peer discussion','detail'),'<p class="muted">Add the details required to generate this document.</p>'+[['consultant','Consultant name'],['specialty','Specialty'],['reason','Reason for discussion']].map(([id,l])=>`<label class="form-label" for="${id}">${l} (required)</label>${id==='reason'?`<textarea id="${id}" class="field" rows="4"></textarea>`:`<input id="${id}" class="field" autocomplete="off">`}<div class="field-error" id="${id}-error"></div>`).join(''),footer(btn('Generate discussion','peer-submit')+textbtn('Cancel','go:detail')))}
function settings(){return layout(head('Settings'),'<h3 style="margin-top:12px">Appearance</h3><div class="group" role="radiogroup" aria-label="Appearance">'+option('System','Match device appearance','system',theme,'theme')+option('Light','','light',theme,'theme')+option('Dark','','dark',theme,'theme')+'</div><h3>Office connection</h3><div class="group">'+row('Office server',state==='offline'?'Unreachable':'Connection not checked','check','link')+'<details class="details"><summary>Connection details</summary><p>Office: demo-office.invalid<br>Phone label: Demo phone<br>Pairing port: 11436<br>Data port: 11437</p><p>Example values only; not a configured connection.</p></details></div>'+textbtn('Check connection','check')+'<h3>Privacy</h3><p class="small muted">Content is hidden in the app switcher. Cached documents use encrypted app storage. Copy and sharing happen only when you choose them.</p>'+textbtn('Unpair this phone','unpair','danger-text'))}
function pair(){return layout(head('Ferri<span class="accent">Scribe</span>',null),'<h2>Connect to your office.</h2><p class="muted">Pair this phone with your FerriScribe desktop app.</p>'+[['01','Open FerriScribe on your desktop.'],['02','Display the desktop pairing QR.'],['03','Make sure Tailscale is connected on this phone.']].map(s=>`<div class="entry-step"><span class="num">${s[0]}</span><p>${s[1]}</p></div>`).join('')+notice('Only pair with an office server you recognise.'),footer(btn('Scan pairing QR','go:scanner','','qr')+textbtn('Enter pairing link','go:manual')))}
function scanner(){return layout(head('Scan pairing QR','pair'),'<p class="muted">Point the camera at the QR on your FerriScribe desktop.</p><div class="scanner">'+icon('qr')+'<span>Camera viewport — design only</span></div><p class="helper">No real QR code or pairing secret is shown.</p>',footer(btn('Simulate QR detected','go:confirm','secondary')+textbtn('Enter pairing link instead','go:manual')))}
function manual(){return layout(head('Enter pairing link','pair'),'<p class="muted">Use the pairing link from your desktop FerriScribe app.</p><label class="form-label" for="pairing-link">Pairing link</label><textarea class="field" id="pairing-link" placeholder="Paste your pairing link" autocomplete="off"></textarea><p class="helper">Design simulation: do not paste a real pairing secret.</p>',footer(btn('Simulate link accepted','go:confirm')))}
function confirm(){return layout(head('Confirm office','pair'),'<h2>Pair this phone?</h2><p class="muted">Check the office before continuing.</p><div class="group" style="padding:16px"><p class="zero">demo-office.invalid</p><p class="small muted zero">Synthetic server address</p></div><label class="form-label" for="device-label">Phone label</label><input class="field" id="device-label" value="Demo phone"><p class="helper">This helps you recognise the phone on your desktop.</p>',footer(btn('Simulate pairing','go:home','','link')+textbtn('Scan again','go:scanner')))}
const renders={home,prepare,context:contextForm,record,processing,complete,detail,reader,edit,peer,settings,pair,scanner,manual,confirm};
function phone(s,boardMode=false){return `<div class="phone ${isDark()?'dark':''}" ${boardMode?'inert':''} data-screen="${s}"><div class="statusbar"><span>9:41</span><span class="statusicons">${icon('wifi')}${icon('battery')}</span></div>${(renders[s]||home)()}<div class="gesture" aria-hidden="true"></div></div>`}
function render(){document.querySelector('#screen-picker').value=screen;document.querySelector('#theme-picker').value=theme;document.querySelector('#state-picker').value=state;document.querySelector('#view-toggle').textContent=board?'Interactive preview':'Overview';document.querySelector('#view-toggle').classList.toggle('on',board);document.body.classList.toggle('large',large);if(board){const savedState=state;state='normal';document.querySelector('#preview').className='board';document.querySelector('#preview').innerHTML=[['home','01','The daily workspace'],['record','02','Focused recording'],['reader','03','Readable clinical text']].map(([s,n,t])=>`<div><div class="caption"><strong>${n}</strong>${t}</div>${phone(s,true)}</div>`).join('');state=savedState;}else{document.querySelector('#preview').className='preview-wrap';document.querySelector('#preview').innerHTML=phone(screen)+`<aside class="preview-aside"><div class="eyebrow">${screenNames[screen]}</div><h3>One clear next action.</h3><p>This is the proposed interface, not a build of the app. Use the screen and state pickers to inspect the whole flow.</p><ul><li>System, Light and Dark themes</li><li>Explicit save, copy and sharing</li><li>Clear cached and unsaved states</li><li>Settings out of the daily workflow</li></ul><p>Record → Stop → simulated processing → SOAP → Edit → Save → Export.</p><p>All names, dates and document text are synthetic. Interactions here never contact a real service.</p></aside>`;if(modal)renderModal();}}
function nav(s){if(s==='discard'){showModal('discard');return}if(s==='leaveedit'){leaveEdit();return}screen=s;modal=null;render()}
function toast(msg){const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=msg;document.querySelector('.phone').append(el);setTimeout(()=>el.remove(),3800)}
function showModal(type){modal=type;renderModal();document.querySelector('.sheet button')?.focus()}
function renderModal(){document.querySelector('.sheet-backdrop')?.remove();let title='',content='';if(modal==='export'){title='Export & share';content='<p class="muted small">'+esc(currentDoc)+' · DEMO PATIENT A</p><div class="group format" role="radiogroup" aria-label="File format">'+option('PDF','Fixed layout','pdf',selectedFormat,'format')+option('Word (.docx)','Editable document','docx',selectedFormat,'format')+'</div><p class="small muted">Choose a trusted destination. Shared files may be stored outside FerriScribe.</p><div class="stack">'+btn('Continue to share','share','','share')+textbtn('Cancel','closemodal')+'</div>'}else if(modal==='share'){title='System sharing';content='<p class="muted">The real app opens the Android or iOS share sheet here.</p><p class="small muted">This preview does not create or share a file.</p>'+btn('Return to document','closemodal','secondary')}else if(modal==='discard'){title='Discard this recording?';content='<p>Audio recorded on this phone will be lost.</p><div class="stack">'+btn('Keep recording','closemodal')+textbtn('Discard recording','discard-confirm','danger-text')+'</div>'}else if(modal==='dirty'){title='Keep your changes?';content='<p>Your edits have not been saved to the office server.</p><div class="stack">'+btn('Save & leave','saveleave')+btn('Keep editing','closemodal','secondary')+textbtn('Discard changes','discardedit','danger-text')+'</div>'}else if(modal==='unpair'){title='Unpair this phone?';content='<p>Removes this phone’s stored access token.</p><p class="small muted">If the office server cannot be reached, access may remain active there until revoked from the desktop app.</p><div class="stack">'+btn('Keep paired','closemodal')+textbtn('Simulate unpair','go:pair','danger-text')+'</div>'}else if(modal==='more'){title='Document actions';content=row('Copy text','Explicit action only','copy','copy')+textbtn('Cancel','closemodal')}
const el=document.createElement('div');el.className='sheet-backdrop';el.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="handle"></div><h3 id="sheet-title">${title}</h3>${content}</section>`;document.querySelector('.phone').append(el)}
function closeModal(){modal=null;document.querySelector('.sheet-backdrop')?.remove();document.querySelector('.phone .appbar button')?.focus()}
function leaveEdit(){if(dirty||state==='saveerror')showModal('dirty');else nav('reader')}
function save(leave=false){if(state==='saveerror'){render();toast('Simulated save failure. The edited text is retained.');return}dirty=false;nav('reader');toast('Simulated: saved to office server')}
document.querySelector('#screen-picker').innerHTML=Object.entries(screenNames).map(([id,name])=>`<option value="${id}">${name}</option>`).join('');
document.querySelector('#screen-picker').onchange=e=>{board=false;nav(e.target.value)};document.querySelector('#theme-picker').onchange=e=>setTheme(e.target.value);document.querySelector('#state-picker').onchange=e=>{state=e.target.value;modal=null;render()};document.querySelector('#view-toggle').onclick=()=>{board=!board;modal=null;render()};document.querySelector('#text-size').onclick=()=>{large=!large;render()};
function setTheme(v){theme=v;localStorage.setItem('fs-design-theme',v);render()}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(theme==='system')render()});
document.querySelector('#preview').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||board)return;const a=b.dataset.action;if(a.startsWith('go:')){if(screen==='edit'&&a.slice(3)!=='leaveedit'){leaveEdit();return}nav(a.slice(3));return}if(a.startsWith('theme:')){setTheme(a.slice(6));return}if(a.startsWith('format:')){selectedFormat=a.slice(7);renderModal();return}if(a.startsWith('open:')){currentDoc=a.slice(5);nav('reader');return}if(a.startsWith('generate:')){currentDoc=a.slice(9);nav('reader');toast('Simulated generation — no server request');return}switch(a){case'check':toast('Preview only: no connection check is performed');break;case'retry':state='normal';render();toast('Simulated reconnection');break;case'clearsearch':search='';render();break;case'start':nav('record');break;case'stop':nav('processing');break;case'discard':showModal('discard');break;case'discard-confirm':contextAdded=false;nav('home');break;case'usecontext':contextName=document.querySelector('#patient-name').value.trim();contextAdded=!!contextName||[...document.querySelectorAll('.field')].some(el=>el.value.trim());nav('prepare');break;case'more':showModal('more');break;case'copy':closeModal();toast('Preview only: clipboard unchanged');break;case'export':showModal('export');break;case'share':showModal('share');break;case'closemodal':closeModal();break;case'leaveedit':leaveEdit();break;case'save':save();break;case'saveleave':save(true);break;case'discardedit':dirty=false;editText=baseDoc;state='normal';nav('reader');break;case'unpair':showModal('unpair');break;case'peer-submit':{let valid=true;['consultant','specialty','reason'].forEach(id=>{const input=document.getElementById(id),error=document.getElementById(id+'-error');error.textContent=input.value.trim()?'':'This field is required.';input.setAttribute('aria-invalid',String(!input.value.trim()));input.setAttribute('aria-describedby',id+'-error');if(!input.value.trim()){if(valid)input.focus();valid=false}});if(valid){currentDoc='Peer discussion';nav('reader');toast('Simulated generation — no server request')}break}case'noop':toast('Reconnect before recording');break}});
document.querySelector('#preview').addEventListener('input',e=>{if(e.target.id==='doc-edit'){editText=e.target.value;dirty=true;document.querySelector('#edit-status').textContent='Unsaved changes'}if(e.target.dataset.input==='search'){search=e.target.value;const pos=e.target.selectionStart;render();const inp=document.querySelector('[data-input="search"]');inp.focus();inp.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(!modal)return;if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const nodes=[...document.querySelectorAll('.sheet button,.sheet input')].filter(n=>!n.disabled);if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();
</script></body></html>
